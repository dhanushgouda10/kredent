# DB_URL: use jdbc:postgresql://... or paste Supabase postgresql://... (normalized at startup).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
# JWT_SECRET must be a long, random string in real deployments (32+ chars). The
# fallback below is only for local dev and is intentionally obvious so nobody
# ships it by accident.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin seed (creates one admin row on startup if ADMIN_WALLET_ADDRESS is set)
admin.seed.email=${ADMIN_EMAIL:}
admin.seed.full-name=${ADMIN_FULL_NAME:MVJCE Admin}
admin.seed.wallet-address=${ADMIN_WALLET_ADDRESS:}

# Supabase Storage — service role key is server-side only, never sent to the frontend.
# Get these from Project Settings > API in your Supabase dashboard.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:certificates}

# Certificate file upload — this is the real, user-facing limit (clear error message).
app.certificate.max-file-size-mb=${CERTIFICATE_MAX_FILE_SIZE_MB:5}

# Spring's own multipart ceiling, set a bit above the business limit above so our own
# validation (with a clearer message) rejects oversized files before Spring's generic one does.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.port=8081